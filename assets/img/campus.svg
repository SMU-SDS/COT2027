<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stylized SMU campus skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3d85"/>
      <stop offset="100%" stop-color="#4a63bb"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f4fa"/>
      <stop offset="100%" stop-color="#c9d1e8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#sky)"/>

  <!-- distant tree line -->
  <g fill="#32468f" opacity="0.85">
    <circle cx="120" cy="400" r="70"/><circle cx="210" cy="415" r="55"/><circle cx="60" cy="425" r="50"/>
    <circle cx="1480" cy="400" r="72"/><circle cx="1390" cy="418" r="52"/><circle cx="1560" cy="420" r="55"/>
    <circle cx="330" cy="425" r="45"/><circle cx="1275" cy="425" r="45"/>
  </g>

  <!-- wings -->
  <rect x="368" y="332" width="140" height="98" fill="url(#stone)" opacity="0.93"/>
  <rect x="1092" y="332" width="140" height="98" fill="url(#stone)" opacity="0.93"/>

  <!-- main block -->
  <rect x="500" y="300" width="600" height="130" fill="url(#stone)"/>

  <!-- windows -->
  <g fill="#4a63bb" opacity="0.55">
    <rect x="392" y="352" width="18" height="30"/><rect x="430" y="352" width="18" height="30"/><rect x="468" y="352" width="18" height="30"/>
    <rect x="392" y="394" width="18" height="26"/><rect x="430" y="394" width="18" height="26"/><rect x="468" y="394" width="18" height="26"/>
    <rect x="1114" y="352" width="18" height="30"/><rect x="1152" y="352" width="18" height="30"/><rect x="1190" y="352" width="18" height="30"/>
    <rect x="1114" y="394" width="18" height="26"/><rect x="1152" y="394" width="18" height="26"/><rect x="1190" y="394" width="18" height="26"/>
    <rect x="524" y="322" width="20" height="34"/><rect x="566" y="322" width="20" height="34"/><rect x="608" y="322" width="20" height="34"/><rect x="650" y="322" width="20" height="34"/>
    <rect x="930" y="322" width="20" height="34"/><rect x="972" y="322" width="20" height="34"/><rect x="1014" y="322" width="20" height="34"/><rect x="1056" y="322" width="20" height="34"/>
    <rect x="524" y="374" width="20" height="30"/><rect x="566" y="374" width="20" height="30"/><rect x="608" y="374" width="20" height="30"/><rect x="650" y="374" width="20" height="30"/>
    <rect x="930" y="374" width="20" height="30"/><rect x="972" y="374" width="20" height="30"/><rect x="1014" y="374" width="20" height="30"/><rect x="1056" y="374" width="20" height="30"/>
  </g>

  <!-- dome -->
  <rect x="762" y="132" width="76" height="86" fill="url(#stone)"/>
  <path d="M754 140 a46 52 0 0 1 92 0 z" fill="#e6eaf6"/>
  <rect x="788" y="66" width="24" height="30" fill="#e6eaf6"/>
  <path d="M784 68 a16 18 0 0 1 32 0 z" fill="#f2f4fa"/>
  <rect x="798" y="44" width="4" height="24" fill="#f2f4fa"/>

  <!-- portico -->
  <path d="M686 272 L800 208 L914 272 Z" fill="#eef1f9"/>
  <rect x="686" y="272" width="228" height="14" fill="#dde3f2"/>
  <g fill="#e9edf7">
    <rect x="700" y="286" width="16" height="132"/><rect x="736" y="286" width="16" height="132"/>
    <rect x="772" y="286" width="16" height="132"/><rect x="808" y="286" width="16" height="132"/>
    <rect x="844" y="286" width="16" height="132"/><rect x="880" y="286" width="16" height="132"/>
  </g>
  <rect x="686" y="418" width="228" height="12" fill="#dde3f2"/>

  <!-- ground and foreground trees -->
  <rect x="0" y="430" width="1600" height="70" fill="#22336d"/>
  <g fill="#1b2a5c">
    <circle cx="250" cy="430" r="62"/><circle cx="330" cy="448" r="48"/>
    <circle cx="1350" cy="432" r="60"/><circle cx="1270" cy="450" r="46"/>
  </g>
</svg>
